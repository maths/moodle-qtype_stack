<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Basic Container Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 960px;
        }

        .example-panel {
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Basic Container Mode</h1>
        <p>
            This page creates a generated textarea and rendered output pane inside one empty container.
        </p>

        <div class="example-panel">
            <div id="basicContainer"></div>
            <input id="demoExpressionAnswer"></input>
        </div>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.StackWeb.ready(() => {
            new window.StackWeb.StackAsciiDisplay({
                containerId: 'basicContainer',
                initialWidth: '100%',
                initialHeight: 260,
                minHeight: 180,
                initialText: [
                    'A short worked example.',
                    '',
                    '`',
                    'x^2 - 5x + 6 = 0',
                    '(x - 2)(x - 3) = 0',
                    'x = 2 or x = 3',
                    '`',
                    '',
                    'Check: {@2^2 - 5*2 + 6@}'
                ].join('\n'),
                operations: [
                    { operation: 'filter', type: 'calculation' },
                    {
                        operation: 'filter',
                        type: 'markdown',
                        transforms: 'asciimath,aligneq,minwrap',
                        display: 'true'
                    },
                    {
                        targetinput: 'demoExpressionAnswer',
                        operation: 'extractor',
                        type: 'laststringremainderwhitespace',
                        search: 'Check:'
                    }
                ]
            });
        });
    </script>
</body>
</html>
