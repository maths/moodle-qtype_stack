<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Defaults Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 960px;
        }

        .example-panel {
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Defaults</h1>
        <p>
            This page omits the operations array and uses the default Markdown/math display filter.
        </p>

        <div class="example-panel">
            <div id="defaultsContainer"></div>
        </div>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.StackWeb.ready(() => {
            new window.StackWeb.StackAsciiDisplay({
                containerId: 'defaultsContainer',
                initialWidth: '100%',
                initialHeight: 300,
                minHeight: 220,
                initialText: [
                    'The default filter renders Markdown and ASCIIMath.',
                    '',
                    'Inline mathematics such as `x^2 - 5x + 6` is converted for MathJax.',
                    '',
                    '`',
                    'x^2 - 5x + 6 = 0',
                    '(x - 2)(x - 3) = 0',
                    'x = 2 or x = 3',
                    '`',
                    '',
                    'Markdown lists also work:',
                    '',
                    '- The multiline block is aligned.',
                    '- The inline expressions stay inline.'
                ].join('\n')
            });
        });
    </script>
</body>
</html>
