<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Existing Elements Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 960px;
        }

        .example-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        #responseInput,
        #responseOutput {
            min-height: 280px;
            overflow: auto;
            resize: vertical;
        }

        @media (max-width: 768px) {
            .example-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Existing Elements</h1>
        <p>
            This page wires existing input and output containers and extracts one answer field.
        </p>

        <div class="example-grid mb-3">
            <div>
                <label class="form-label" for="responseInput">Response</label>
                <div id="responseInput"></div>
            </div>
            <div>
                <label class="form-label" for="responseOutput">Rendered response</label>
                <div id="responseOutput"></div>
            </div>
        </div>

        <label class="form-label" for="answerOutput">Extracted answer</label>
        <input class="form-control font-monospace" id="answerOutput" type="text" readonly>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        function initExample() {
            if (typeof window.StackWeb === 'undefined' ||
                    typeof MathJax === 'undefined' ||
                    typeof MathJax.typesetPromise === 'undefined') {
                setTimeout(initExample, 100);
                return;
            }

            const StackAsciiDisplay = window.StackWeb.default;
            new StackAsciiDisplay({
                inputElementId: 'responseInput',
                outputElementId: 'responseOutput',
                initialText: `Solve the equation.

\`
2x + 3 = 11
2x = 8
x = 4
\`

Answer: \`x = 4\``,
                operations: [
                    {
                        operation: 'filter',
                        type: 'markdown',
                        transforms: 'asciimath,aligneq,minwrap',
                        display: 'true'
                    },
                    {
                        operation: 'extractor',
                        type: 'laststringremainderwhitespace',
                        targetinput: 'answerOutput',
                        search: 'Answer:'
                    }
                ]
            });
        }

        window.addEventListener('DOMContentLoaded', initExample);
    </script>
</body>
</html>
