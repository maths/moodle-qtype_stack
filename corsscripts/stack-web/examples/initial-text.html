<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Initial Text Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 760px;
        }

        #initialTextOutput > .stack-ascii-output {
            min-height: 220px;
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Initial Text</h1>
        <p>
            This page renders a display from the initialText option without an input element.
        </p>

        <div id="initialTextOutput"></div>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.StackWeb.ready(() => {
            new window.StackWeb.StackAsciiDisplay({
                outputElementId: 'initialTextOutput',
                initialText: [
                    'A static worked example can be rendered without creating an input.',
                    '',
                    '`',
                    'f(x) = x^2 - 4x + 7',
                    'f(x) = (x - 2)^2 + 3',
                    '`',
                    '',
                    'The minimum value is therefore `3`, attained when `x = 2`.'
                ].join('\n'),
                operations: [
                    {
                        operation: 'filter',
                        type: 'markdown',
                        transforms: 'asciimath,aligneq,minwrap',
                        display: 'true'
                    }
                ]
            });
        });
    </script>
</body>
</html>
