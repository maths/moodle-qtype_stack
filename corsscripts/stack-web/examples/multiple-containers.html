<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Multiple Containers Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 1100px;
        }

        .example-panel {
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Multiple Containers</h1>
        <p>
            This page creates two independent generated STACK web containers on the same page.
        </p>

        <div class="vstack gap-3">
            <section class="example-panel">
                <h2 class="h5">Linear equation</h2>
                <div id="linearContainer"></div>

                <label class="form-label mt-3" for="linearAnswer">Extracted answer</label>
                <input class="form-control font-monospace" id="linearAnswer" type="text" readonly>
            </section>

            <section class="example-panel">
                <h2 class="h5">Quadratic equation</h2>
                <div id="quadraticContainer"></div>

                <label class="form-label mt-3" for="quadraticAnswer">Extracted answer</label>
                <input class="form-control font-monospace" id="quadraticAnswer" type="text" readonly>
            </section>
        </div>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.StackWeb.ready(() => {
            const commonOperations = (targetinput) => [
                { operation: 'filter', type: 'calculation' },
                {
                    operation: 'filter',
                    type: 'markdown',
                    transforms: 'asciimath,aligneq,minwrap',
                    display: 'true'
                },
                {
                    operation: 'extractor',
                    type: 'laststringremainderwhitespace',
                    targetinput,
                    search: 'Answer:'
                }
            ];

            new window.StackWeb.StackAsciiDisplay({
                containerId: 'linearContainer',
                initialWidth: '100%',
                initialHeight: 260,
                minHeight: 180,
                initialText: [
                    'Solve the linear equation.',
                    '',
                    '`',
                    '3x - 7 = 11',
                    '3x = 18',
                    'x = 6',
                    '`',
                    '',
                    'Check: {@3*6 - 7@}',
                    '',
                    'Answer: `x = 6`'
                ].join('\n'),
                operations: commonOperations('linearAnswer')
            });

            new window.StackWeb.StackAsciiDisplay({
                containerId: 'quadraticContainer',
                initialWidth: '100%',
                initialHeight: 260,
                minHeight: 180,
                initialText: [
                    'Solve the quadratic equation.',
                    '',
                    '`',
                    'x^2 - 5x + 6 = 0',
                    '(x - 2)(x - 3) = 0',
                    'x = 2 or x = 3',
                    '`',
                    '',
                    'Check one root: {@2^2 - 5*2 + 6@}',
                    '',
                    'Answer: `x = 2 or x = 3`'
                ].join('\n'),
                operations: commonOperations('quadraticAnswer')
            });
        });
    </script>
</body>
</html>
