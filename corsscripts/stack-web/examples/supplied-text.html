<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK Web Supplied Text Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        main {
            max-width: 760px;
        }

        #staticOutput {
            min-height: 180px;
        }
    </style>
</head>
<body>
    <main class="container py-4">
        <h1 class="h3 mb-3">Supplied Text</h1>
        <p>
            This page renders static source text into an output element without creating a textarea.
        </p>

        <div id="staticSource" hidden>Use supplied text for read-only examples.

`
sum_(i=1)^n i = (n(n+1))/2
`

The identity gives `sum_(i=1)^5 i = 15`.</div>

        <div class="stack-ascii-output" id="staticOutput"></div>
    </main>

    <script src="../dist/stack-web.bundle.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        function initExample() {
            if (typeof window.StackWeb === 'undefined' ||
                    typeof MathJax === 'undefined' ||
                    typeof MathJax.typesetPromise === 'undefined') {
                setTimeout(initExample, 100);
                return;
            }

            const StackAsciiDisplay = window.StackWeb.default;
            new StackAsciiDisplay({
                suppliedTextElementId: 'staticSource',
                outputElementId: 'staticOutput',
                operations: [
                    {
                        operation: 'filter',
                        type: 'markdown',
                        transforms: 'asciimath,aligneq,minwrap',
                        display: 'true'
                    }
                ]
            });
        }

        window.addEventListener('DOMContentLoaded', initExample);
    </script>
</body>
</html>
